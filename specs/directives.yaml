version: "14.0"
description: "Repository-specific requirements for the Ask Discord assistant."
directives:
  - id: E-3000.0
    dos:
      - "Provide answers, web lookup, and image creation through the /ask command."
      - "Support address mentions, replies, direct messages, localized help, and channel context."
      - "Require DISCORD_CLIENT_ID, DISCORD_TOKEN, and OPENAI_API_KEY at startup."
      - "Keep command definitions and handlers aligned with README.md and the application."
      - "Keep event behavior aligned with README.md and the application."
      - >-
        Keep supported intents and required permissions aligned with README.md
        and the application.
    donts:
      - "Do not request intents or permissions that the application does not use."
      - "Do not commit runtime credentials or deploy the bot as part of validation."
