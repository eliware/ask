services:
  ask:
    build: .
    image: ask:local
    env_file: .env
    environment:
      HEALTH_HOST: ${HEALTH_HOST:-127.0.0.1}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
